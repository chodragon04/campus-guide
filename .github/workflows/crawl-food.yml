name: 학식 크롤링

on:
  schedule:
    - cron: "0 21 * * 0-4"   # 월~금 06:00 (한국 시간)
    - cron: "0 2 * * 1-5"    # 월~금 11:00 (한국 시간), 늦게 올라온 식단 반영
  workflow_dispatch:          # Actions 탭에서 직접 실행
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/crawl-food.yml"

permissions:
  contents: write

concurrency:
  group: crawl-food
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 학교 서버가 중간 인증서를 보내지 않아 Node.js가 접속을 거부한다(UNABLE_TO_VERIFY_LEAF_SIGNATURE).
      # 보안 검사를 끄는 대신, 학교 인증서에 적힌 발급처(CA Issuers) 주소에서 중간 인증서를 받아 추가한다.
      - name: 학교 사이트 중간 인증서 받기
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP"
          : > extra-ca.pem
          for HOST in www.seoultech.ac.kr housing.seoultech.ac.kr; do
            echo | openssl s_client -connect "$HOST:443" -servername "$HOST" 2>/dev/null | openssl x509 > leaf.pem || continue
            ISSUER_URL=$(openssl x509 -in leaf.pem -noout -text | grep -m1 "CA Issuers" | sed 's/.*URI://')
            echo "$HOST 중간 인증서 주소: $ISSUER_URL"
            [ -n "$ISSUER_URL" ] || continue
            curl -sSL "$ISSUER_URL" -o intermediate.crt
            openssl x509 -inform DER -in intermediate.crt -out intermediate.pem 2>/dev/null || cp intermediate.crt intermediate.pem
            cat intermediate.pem >> extra-ca.pem
          done
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/extra-ca.pem" >> "$GITHUB_ENV"

      - run: npm run crawl

      - run: node scripts/inspect.js   # [임시] 페이지 구조 확인

      - name: 변경된 식단 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/food.json data/debug.json
          git diff --staged --quiet || (git commit -m "학식 데이터 업데이트" && git pull --rebase && git push)
