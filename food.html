<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학식 | 과기대 캠퍼스 가이드</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/food.css">
</head>
<body data-page="food">
  <header id="site-header">
    <a href="index.html" id="logo">과기대 캠퍼스 가이드</a>
    <nav id="menu">
      <a href="index.html" data-key="home">홈</a>
      <a href="map.html" data-key="map">캠퍼스 지도</a>
      <a href="buildings.html" data-key="buildings">건물·시설</a>
      <a href="food.html" data-key="food">학식</a>
      <a href="timetable.html" data-key="timetable">내 시간표</a>
    </nav>
  </header>

  <main id="content">
    <h1>학식</h1>

    <section class="food-group">
      <h2>생활관 식당</h2>
      <p class="hint">학기 중 평일 조식 07:30~08:50 · 중식 11:30~13:30 · 석식 17:30~18:40 (주말은 시간이 다름)</p>
      <div id="day-tabs">
        <button data-day="1">월</button>
        <button data-day="2">화</button>
        <button data-day="3">수</button>
        <button data-day="4">목</button>
        <button data-day="5">금</button>
        <button data-day="6">토</button>
        <button data-day="7">일</button>
      </div>
      <div id="dorm-list" class="card-grid"></div>
    </section>

    <section class="food-group">
      <h2>학생식당 메뉴판</h2>
      <p class="hint">ST:Table과 ST:Dining은 매일 바뀌는 식단 대신 브랜드별 고정 메뉴를 판매합니다. 브랜드를 누르면 메뉴가 펼쳐집니다.</p>
      <div id="fixed-list" class="card-grid"></div>
    </section>

    <section class="food-group">
      <h2>테크노파크</h2>
      <div id="weekly-list"></div>
    </section>

    <p id="updated"></p>
  </main>

  <footer id="site-footer">
    <p>웹프로그래밍 프로젝트 · 서울과학기술대학교</p>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/food.js"></script>
</body>
</html>
