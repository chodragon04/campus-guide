<body data-page="friends">

    <a href="index.html" id="logo"><svg viewBox="0 0 30 30" class="logo-mark" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" fill="#fff"/><path d="M8.5 21.5C8.5 14 21.5 16 21.5 8.5" fill="none" stroke="#898D8D" stroke-width="2" stroke-dasharray="2.2 2.4" stroke-linecap="round"/><circle cx="8.5" cy="21.5" r="3.2" fill="#00205B"/><circle cx="15" cy="15" r="1.6" fill="#898D8D"/><circle cx="21.5" cy="8.5" r="3.6" fill="#A4343A"/></svg><span>과기대 캠퍼스 가이드</span></a>

  <main id="content">
    <h1>친구</h1>
    <p id="friends-status" class="hint">친구가 되면 내 시간표와 홈 화면에서 같은 수업을 듣는 친구를 볼 수 있고, 서로의 시간표도 볼 수 있어요. 친구가 아닌 사람은 내 시간표를 볼 수 없어요.</p>

    <div id="friends-area">
      <section class="friend-section">
        <h2>친구 신청 보내기</h2>
        <form id="request-form">
          <input type="text" id="friend-id" placeholder="친구 아이디" autocomplete="off" autocapitalize="none" required>
          <button type="submit">신청</button>
        </form>
        <p id="request-message"></p>
      </section>

      <section class="friend-section">
        <h2>받은 신청 <span id="incoming-count"></span></h2>
        <ul id="incoming" class="friend-list"></ul>
      </section>

      <section class="friend-section">
        <h2>보낸 신청 <span id="outgoing-count"></span></h2>
        <ul id="outgoing" class="friend-list"></ul>
      </section>

      <section class="friend-section">
        <h2>친구 목록 <span id="friend-count"></span></h2>
        <p class="hint">친구 이름을 누르면 친구의 시간표를 볼 수 있어요.</p>
        <ul id="friend-list" class="friend-list"></ul>
      </section>
    </div>
  </main>

  <footer id="site-footer">
    <p>웹프로그래밍 프로젝트 · 서울과학기술대학교</p>
  </footer>

  <script src="js/common.js"></script>
