  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body data-page="login">
  <header id="site-header">
    <a href="index.html" id="logo"><svg viewBox="0 0 30 30" class="logo-mark" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" fill="#fff"/><path d="M8.5 21.5C8.5 14 21.5 16 21.5 8.5" fill="none" stroke="#898D8D" stroke-width="2" stroke-dasharray="2.2 2.4" stroke-linecap="round"/><circle cx="8.5" cy="21.5" r="3.2" fill="#00205B"/><circle cx="15" cy="15" r="1.6" fill="#898D8D"/><circle cx="21.5" cy="8.5" r="3.6" fill="#A4343A"/></svg><span>과기대 캠퍼스 가이드</span></a>
    <nav id="menu">
      <a href="index.html" data-key="home">홈</a>
      <a href="map.html" data-key="map">캠퍼스 지도</a>
      <a href="buildings.html" data-key="buildings">건물·시설</a>
      <a href="food.html" data-key="food">학식</a>
      <a href="timetable.html" data-key="timetable">내 시간표</a>
    </nav>
  </header>

  <main id="content">
    <section id="auth-box">
      <h1 id="auth-title">로그인</h1>
      <p class="hint" id="auth-desc">로그인하면 내 시간표를 계정에 저장해 어느 기기에서든 볼 수 있어요.</p>

      <form id="auth-form">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required>

        <label for="nickname" class="signup-only">닉네임 (친구에게 보이는 이름, 1~12글자)</label>
        <input type="text" id="nickname" class="signup-only" maxlength="24" autocomplete="nickname">

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <p id="rules" class="hint">아이디: 영어 소문자·숫자·밑줄(_) 4~20자 / 닉네임: 1~12글자 / 비밀번호: 8자 이상</p>
        <p id="auth-message"></p>
        <button type="submit" id="submit">로그인</button>
        <a href="recover.html" id="forgot-link">비밀번호를 잊었나요?</a>
      </form>

      <p id="switch-mode">
        <span id="switch-text">계정이 없나요?</span>
        <a href="#" id="switch-link">회원가입</a>
      </p>
    </section>
  </main>

  <footer id="site-footer">
    <p>웹프로그래밍 프로젝트 · 서울과학기술대학교</p>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
