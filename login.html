<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 과기대 캠퍼스 가이드</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body data-page="login">
  <header id="site-header">
    <a href="index.html" id="logo">과기대 캠퍼스 가이드</a>
    <nav id="menu">
      <a href="index.html" data-key="home">홈</a>
      <a href="map.html" data-key="map">캠퍼스 지도</a>
      <a href="buildings.html" data-key="buildings">건물·시설</a>
      <a href="food.html" data-key="food">학식</a>
      <a href="timetable.html" data-key="timetable">내 시간표</a>
    </nav>
  </header>

  <main id="content">
    <section id="auth-box">
      <h1 id="auth-title">로그인</h1>
      <p class="hint" id="auth-desc">로그인하면 내 시간표를 계정에 저장해 어느 기기에서든 볼 수 있어요.</p>

      <form id="auth-form">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required>

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <p id="rules" class="hint">아이디: 영어 소문자·숫자·밑줄(_) 4~20자 / 비밀번호: 8자 이상</p>
        <p id="auth-message"></p>
        <button type="submit" id="submit">로그인</button>
      </form>

      <p id="switch-mode">
        <span id="switch-text">계정이 없나요?</span>
        <a href="#" id="switch-link">회원가입</a>
      </p>
    </section>
  </main>

  <footer id="site-footer">
    <p>웹프로그래밍 프로젝트 · 서울과학기술대학교</p>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
