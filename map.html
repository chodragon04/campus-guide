<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캠퍼스 지도 | 과기대 캠퍼스 가이드</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body data-page="map">
  <header id="site-header">
    <a href="index.html" id="logo">과기대 캠퍼스 가이드</a>
    <nav id="menu">
      <a href="index.html" data-key="home">홈</a>
      <a href="map.html" data-key="map">캠퍼스 지도</a>
      <a href="buildings.html" data-key="buildings">건물·시설</a>
      <a href="food.html" data-key="food">학식</a>
      <a href="timetable.html" data-key="timetable">내 시간표</a>
    </nav>
  </header>

  <main id="content">
    <h1>캠퍼스 지도</h1>

    <div class="filter-row">
      <span class="filter-label">종류</span>
      <div id="category-filters">
        <button data-category="all" class="active">전체</button>
        <button data-category="lecture">강의동</button>
        <button data-category="dorm">생활관</button>
        <button data-category="student">학생 편의</button>
        <button data-category="admin">행정·산학</button>
        <button data-category="etc">기타</button>
      </div>
    </div>
    <div class="filter-row">
      <span class="filter-label">편의시설</span>
      <div id="facility-filters">
        <button data-facility="cafe">카페</button>
        <button data-facility="food">식당</button>
        <button data-facility="store">매점</button>
        <button data-facility="atm">ATM</button>
        <button data-facility="print">증명서·복사</button>
      </div>
    </div>

    <p id="map-status" class="hint"></p>
    <div id="map"></div>

    <!-- 마커를 누르면 건물 정보를 보여주는 모달 -->
    <div id="modal-box">
      <div id="modal-contents">
        <button id="close" aria-label="닫기">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>
  </main>

  <footer id="site-footer">
    <p>웹프로그래밍 프로젝트 · 서울과학기술대학교</p>
  </footer>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=0cf3b1df4a0e40e7b19fe11317791c77"></script>
  <script src="js/common.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
